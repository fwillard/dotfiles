source = $HOME/.config/hypr/gruvbox.conf

$accent = $fg
$accentAlpha = $fg_alpha
$font = MesloLGS Nerd Font

# GENERAL
general {
    disable_loading_bar = true
    hide_cursor = true
}

# BACKGROUND
background {
    monitor = 
    path = ~/.config/wallpapers/arch-gruvbox.png
    blur_passes = 2
    color = $bg
}

# TIME
label {
    monitor = HDMI-A-2
    text = cmd[update:30000] echo "$(date +"%I:%M %p")"
    color = $fg
    font_size = 90
    font_family = $font
    position = -30, 0
    halign = right
    valign = top
}

# DATE 
label {
    monitor = HDMI-A-2
    text = cmd[update:43200000] echo "$(date +"%A, %B %d, %Y")"
    color = $fg
    font_size = 25
    font_family = $font
    position = -30, -150
    halign = right
    valign = top
}

# track
label {
    monitor = HDMI-A-2
    text = cmd[update:1000] ./.config/hypr/nowplaying.sh --track
    color = $fg
    font_size = 45
    font_family = $font
    position = 200  , -30
    halign = left
    valign = top
}

# artist
label {
    monitor = HDMI-A-2
    text = cmd[update:1000] ./.config/hypr/nowplaying.sh --artist
    color = $fg
    font_size = 25
    font_family = $font
    position = 200  , -100
    halign = left
    valign = top
}

# album
label {
    monitor = HDMI-A-2
    text = cmd[update:1000] ./.config/hypr/nowplaying.sh --album
    color = $fg
    font_size = 25
    font_family = $font
    position = 200  , -140
    halign = left
    valign = top
}

image {
    monitor = HDMI-A-2
    path = ~/.config/hypr/artwork/empty.png
    size = 150
    border_size = 0
    rounding = 0
    position = 30, -30
    halign = left
    valign = top
    reload_time = 1
    reload_cmd = ./.config/hypr/albumart.sh
}

# USER AVATAR

image {
    monitor = HDMI-A-2
    path = ~/.face/arch-gruvbox.png
    size = 100
    border_color = $accent
    position = 0, 75
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor = HDMI-A-2
    size = 300, 60
    outline_thickness = 4
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = $accent
    inner_color = $bg
    font_color = $fg
    fade_on_empty = false
    placeholder_text = <span foreground="##$fg_alpha"><i>󰌾 Logged in as </i><span foreground="##$accentAlpha">$USER</span></span>
    hide_input = false
    check_color = $accent
    fail_color = $red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $yellow
    position = 0, -35
    halign = center
    valign = center
}
